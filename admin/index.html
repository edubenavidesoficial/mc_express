<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MC Express Admin</title>
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <div>
          <p class="eyebrow">MC Express</p>
          <h1>Panel de administración</h1>
        </div>
        <button id="refreshButton">Actualizar</button>
      </header>

      <section class="cards">
        <article><span>Usuarios</span><strong id="users">0</strong></article>
        <article><span>Profesionales</span><strong id="professionals">0</strong></article>
        <article><span>Solicitudes</span><strong id="requests">0</strong></article>
        <article><span>Pagos</span><strong id="payments">0</strong></article>
      </section>

      <section class="panel">
        <h2>Últimas solicitudes</h2>
        <div id="requestList" class="request-list"></div>
      </section>
    </main>

    <script src="assets/app.js"></script>
  </body>
</html>
